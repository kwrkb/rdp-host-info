version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: rdp-host-info
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: kwrkb
    name: rdp-host-info

# Scoop — Windows 向けの配布チャネル。本ツールは Windows 専用のため、
# 他の配布経路（Homebrew / apt 等）は対象外で Scoop だけで足りる。
#
# トークンはリリース本体用の GITHUB_TOKEN とは別。別リポジトリ（kwrkb/scoop-bucket）への
# write が要り、workflow 既定の GITHUB_TOKEN は当該リポジトリにしか権限が無いため。
# PAT は GitHub Secrets ではなく 1Password の `gh` vault に置き、
# release.yml の load-secrets-action で読み出して env 経由で渡す。
#
# directory は `bucket` にする。scoop の `bucket list` は `<repo>\bucket` 配下しか
# 数えず（lib/buckets.ps1）、リポジトリ直下に置くと Manifests 列が 0 と表示される。
# さらに Find-BucketDirectory は `bucket/` が存在すればそこだけを見るため、
# bucket リポジトリ内で直下と `bucket/` が混在すると直下側が無視される。
scoops:
  - name: rdp-host-info
    directory: bucket
    homepage: https://github.com/kwrkb/rdp-host-info
    description: Windows CLI that shows Remote Desktop connection info and host readiness at a glance
    license: MIT
    # プレリリースでは bucket を更新しない
    skip_upload: auto
    repository:
      owner: kwrkb
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
