name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # internal/winsys/*_windows.go は //go:build windows で隔離されており、
    # Linux では main.go / checks.go がビルドできない。windows-latest 固定必須。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # バイナリ配布版は古い Go でビルドされており go.mod のターゲット Go
          # バージョン（go 1.26.5、非常に新しい）を解釈できず失敗する
          # (can't load config: the Go language version used to build
          # golangci-lint is lower than the targeted Go version)。
          # setup-go で導入済みの Go 1.26.5 でソースビルドさせて回避する。
          install-mode: goinstall
