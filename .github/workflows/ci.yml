name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # internal/winsys/*_windows.go は //go:build windows で隔離されており、
    # Linux では main.go / checks.go がビルドできない。windows-latest 固定必須。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # バイナリ配布版（latest でも v1.64.8 が降ってくる）は go1.24 で
          # ビルドされており go.mod のターゲット Go バージョン（1.26.5、
          # 非常に新しい）を解釈できず "can't load config" で落ちる。
          # goinstall で version: latest にすると今度は v1 系（旧 config
          # schema）が入り、.golangci.yml の v2 フォーマットと非互換になる。
          # ローカル検証済みの v2 系バージョンを明示指定して両方を回避する。
          version: v2.12.2
          install-mode: goinstall
