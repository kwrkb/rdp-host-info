name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # internal/winsys/*_windows.go は //go:build windows で隔離されており、
    # Linux では main.go / checks.go がビルドできない。windows-latest 固定必須。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        # golangci-lint-action は使わず go install で直接導入する。
        # - バイナリ配布版（latest でも v1.64.8 が降ってくる）は go1.24 で
        #   ビルドされており go.mod のターゲット Go バージョン（1.26.5、
        #   非常に新しい）を解釈できず "can't load config" で落ちる。
        # - install-mode: goinstall は v2 系のモジュールパス
        #   （github.com/golangci/golangci-lint/v2/...）を認識せず失敗する。
        # ローカル検証済みの v2.12.2 を正しい /v2 パスで go install する。
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...
